[project]
name = "im_agent"
version = "0.1.0"
description = "macOS Desktop Automation Smart Agent"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "requests>=2.20",
    "langgraph>=0.0.15",
    "fastapi>=0.110.0",
    "Appium-Python-Client>=3.1.0",
    "uvicorn>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "src/im_interface"] 